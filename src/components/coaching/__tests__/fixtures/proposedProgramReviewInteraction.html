<!doctype html><html><body><div id="root"></div><script type="module">
  import React from 'react'
  import { createRoot } from 'react-dom/client'
  import { ProposedProgramReview } from '../../ProposedProgramReview'
  const params = new URLSearchParams(window.location.search)
  const canAccept = params.get('canAccept') !== 'false'
  const exerciseDetailsAvailable = params.get('exerciseDetails') !== 'unavailable'
  const root = createRoot(document.getElementById('root'))
  function renderProposal(isPrevious = false) {
    root.render(React.createElement(ProposedProgramReview, {
      proposal: {
      assignmentId: isPrevious ? '22222222-2222-4222-8222-222222222222' : '11111111-1111-4111-8111-111111111111',
      versionNumber: 1,
      canAccept,
      exerciseDetailsAvailable,
      changeSummary: 'Prioriza la tecnica antes que el peso.',
      trainerName: 'Entrenadora Ada',
      exerciseNames: { 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa': 'Sentadilla' },
      snapshot: {
        schemaVersion: 1,
        name: isPrevious ? 'Rutina anterior pendiente' : 'Rutina inicial',
        goal: 'Fuerza',
        description: 'Una propuesta segura.',
        daysPerWeek: 1,
        workouts: [{
          sourceTemplateWorkoutId: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
          name: 'Dia uno',
          dayOfWeek: 1,
          orderInPlan: 1,
          exercises: [{
            sourceTemplateExerciseId: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
            exerciseId: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            orderIndex: 1,
            sets: 3,
            reps: 8,
            weightKg: null,
            targetRpe: 7,
            restSeconds: 60,
            notes: 'Mantener el tronco estable.',
          }],
        }],
      },
    },
  }))
  }
  window.__PROPOSAL_APPLY_SERVER_STATE__ = () => {
    if (params.has('nextProposal')) renderProposal(true)
  }
  renderProposal()
</script></body></html>
